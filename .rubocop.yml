plugins:
  - rubocop-minitest
  - rubocop-rake
  - rubocop-performance
AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
    Max: 20

Metrics/AbcSize:
    Max: 40

Minitest/MultipleAssertions:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Metrics/ClassLength:
  Exclude:
    - 'test/**/*' # Allow longer test classes

# The gem's entry point is named after the gem.
Naming/FileName:
  Exclude:
    - 'lib/state_machines-mermaid.rb'

# Fixture models name their guards as the fantasy domain reads.
Naming/PredicatePrefix:
  Exclude:
    - 'test/support/models/**/*'
Naming/PredicateMethod:
  Exclude:
    - 'test/support/models/**/*'

# A Mage's focus is an attribute, not Minitest's focus.
Minitest/Focus:
  Exclude:
    - 'test/support/models/**/*'

# Fixture state machines and test classes are long blocks by nature.
Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
